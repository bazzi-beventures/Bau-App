name: Deploy → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Umzugs-Hinweis — NUR in diesem Repo gesetzt, nie in Werkora-App.
          # Dort stuende sonst "Werkora ist umgezogen" auf genau der Seite, auf
          # die umgezogen wurde. Der Streifen erscheint ueber allen Screens,
          # auch im eingeloggten Zustand: der Session-Cookie haelt 30 Tage, wer
          # angemeldet ist sieht sonst im ganzen Parallelbetrieb kein Signal.
          #
          # Die Eskalationsstufen (dezent → Countdown → Vorschaltseite) schalten
          # sich anhand der DEADLINE von selbst, ohne weiteren Deploy.
          # Verschiebt sich der Stichtag, braucht es hier einen neuen Build —
          # der Wert ist in das Bundle eingebacken, nicht zur Laufzeit gelesen.
          # docs/specs/werkora-domain-app-einstieg.md, P5/P9
          VITE_MIGRATION_NOTICE: https://app.werkora.ch
          VITE_MIGRATION_DEADLINE: '2026-09-11'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          cname: app.beventures.ch
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
